[package]
name = "syne-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-shell = "2.3.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
